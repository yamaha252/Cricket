# Cricket tag board: no debug UART (UARTE30 is MSP); with the log on, it goes
# over SWD with RTT (default set in app/Kconfig). Measure current only with the
# release build and after a power cycle (firmware/README.md).

# LIS2DH12 for impact detection (src/impact.c): 16 g, 400 Hz low-power,
# any-motion on INT1 handled in the system work queue, HP filter on INT1.
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
CONFIG_LIS2DH_ACCEL_RANGE_16G=y
CONFIG_LIS2DH_OPER_MODE_LOW_POWER=y
CONFIG_LIS2DH_ODR_7=y
CONFIG_LIS2DH_ACCEL_HP_FILTERS=y
