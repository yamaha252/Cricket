# SPDX-License-Identifier: MIT
# MCUboot with two slots (swap), firmware updates over BLE through SMP (src/dfu.c).
# Signed with the MCUboot development key: anyone can produce an image it
# accepts. Replace with a private key before boards leave the owner
# (SB_CONFIG_BOOT_SIGNATURE_KEY_FILE), see firmware/README.md.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
